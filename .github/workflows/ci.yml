name: CI

on:
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: 'Run slow scientific tests and public tutorial acceptance'
        type: boolean
        default: false
  push:
    branches: [main, mvp]
  pull_request:
    branches: [main, mvp]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.python-version }}, ${{ matrix.profile.name }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
        profile:
          - name: core
            extras: ''
          - name: sqd
            extras: '--extra sqd'
          - name: sqd-catalyst
            extras: '--extra sqd --extra catalyst --extra solvation'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }} --extra dev ${{ matrix.profile.extras }}

      - name: Run linting (ruff)
        if: matrix.profile.name == 'core'
        run: uvx ruff@0.9.10 check src/ tests/ examples/

      - name: Check formatting (black)
        if: matrix.profile.name == 'core'
        run: uvx black@26.3.1 --check src/ tests/ examples/ --line-length 100

      - name: Verify pytest collection and installed profile
        run: uv run --no-sync pytest -n 0 --q2m3-profile "${{ matrix.profile.name }}" --collect-only --no-cov

      - name: Run profile tests with coverage
        run: uv run --no-sync pytest -n 0 --q2m3-profile "${{ matrix.profile.name }}" --cov=src/q2m3 --cov-report=xml --cov-report=term

      - name: Run the H2 user tutorial
        if: matrix.profile.name == 'sqd'
        run: uv run --no-sync python -m examples.sqd.h2_ground_state --output data/output/examples/ci-h2

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: pytest-${{ matrix.python-version }}-${{ matrix.profile.name }}
          name: codecov-${{ matrix.python-version }}-${{ matrix.profile.name }}
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  slow-science:
    name: manual slow science and public tutorial acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv sync --frozen --python 3.12 --extra dev --extra sqd --extra catalyst --extra solvation
      - name: Run complete non-GPU profile including slow tests
        run: uv run --no-sync pytest -n 0 --q2m3-profile sqd-catalyst --q2m3-include-slow --no-cov
      - name: Run end-to-end SQD tutorials
        run: |
          uv run --no-sync python -m examples.sqd.glycine_active_space_scan --output data/output/examples/ci-scan
          uv run --no-sync python -m examples.sqd.glycine_from_integrals --output data/output/examples/ci-integrals
          uv run --no-sync python -m examples.qmmm.glycine_sqd_embedding --output data/output/examples/ci-embedding
      - name: Validate saved showcase directories
        run: Q2M3_SHOWCASE_ROOT=data/output/examples uv run --no-sync pytest -o addopts='' -n 0 tests/examples/test_sqd_showcase.py::test_saved_showcase_directories -v
      - name: Preserve showcase artifacts including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqd-showcase
          path: data/output/examples/

# Documentation build & GitHub Pages deployment live in .github/workflows/docs.yml.
