name: Select CI runner

on:
  workflow_call:
    secrets:
      SELF_HOSTED_RUNNER_READ_TOKEN:
        required: false
    outputs:
      runner:
        description: JSON array of runner labels
        value: ${{ jobs.select.outputs.runner }}

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.select.outputs.runner }}
    steps:
      - name: Validate dedicated runner token
        env:
          RUNNER_READ_TOKEN: ${{ secrets.SELF_HOSTED_RUNNER_READ_TOKEN }}
        run: |
          if [ -z "${RUNNER_READ_TOKEN}" ]; then
            echo "::warning::SELF_HOSTED_RUNNER_READ_TOKEN is not configured."
            exit 0
          fi
          echo "SELF_HOSTED_RUNNER_READ_TOKEN is configured."
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${RUNNER_READ_TOKEN}" \
            https://api.github.com/user)
          echo "Dedicated token GET /user status: ${status}"
          curl -sS -D - -o /dev/null \
            -H "Authorization: Bearer ${RUNNER_READ_TOKEN}" \
            https://api.github.com/user \
            | grep -iE '^(x-oauth-scopes|x-accepted-oauth-scopes|x-github-authentication-token-type):' || true

      - name: Prefer an online Linux x64 self-hosted runner
        id: select
        uses: actions/github-script@v7
        env:
          SELF_HOSTED_RUNNER_HEARTBEAT: ${{ vars.SELF_HOSTED_RUNNER_HEARTBEAT }}
        with:
          github-token: ${{ secrets.SELF_HOSTED_RUNNER_READ_TOKEN || github.token }}
          script: |
            const fallback = ["ubuntu-latest"];
            const preferred = ["self-hosted", "Linux", "X64"];
            const choose = (labels) => core.setOutput("runner", JSON.stringify(labels));
            const heartbeat = Number(process.env.SELF_HOSTED_RUNNER_HEARTBEAT || 0);
            const heartbeatMaxAge = 15 * 60;
            const heartbeatFresh = Number.isFinite(heartbeat) && heartbeat > 0 &&
              Date.now() / 1000 - heartbeat <= heartbeatMaxAge;
            const pr = context.payload.pull_request;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (pr && pr.head.repo?.full_name !== repository) {
              core.notice("Fork pull request: use a GitHub-hosted runner.");
              choose(fallback);
              return;
            }
            try {
              const runners = await github.paginate(
                "GET /repos/{owner}/{repo}/actions/runners",
                { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 },
                (response) => response.data.runners,
              );
              const online = runners.some((runner) =>
                runner.status === "online" && preferred.every((label) =>
                  runner.labels.some((item) => item.name.toLowerCase() === label.toLowerCase())
                )
              );
              core.notice(online ? "Use online self-hosted Linux x64 runners." : "No matching runner online: use GitHub-hosted.");
              choose(online ? preferred : fallback);
            } catch (error) {
              if (heartbeatFresh) {
                core.notice(`Runner lookup failed (HTTP ${error.status ?? "unknown"}); use fresh self-hosted heartbeat.`);
                choose(preferred);
                return;
              }
              core.warning(`Runner lookup failed (HTTP ${error.status ?? "unknown"}); use GitHub-hosted. Configure SELF_HOSTED_RUNNER_READ_TOKEN with repository Administration read permission, or refresh the SELF_HOSTED_RUNNER_HEARTBEAT variable.`);
              choose(fallback);
            }
