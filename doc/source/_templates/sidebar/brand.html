<a class="sidebar-brand{% if logo %} centered{% endif %}" href="{{ pathto(master_doc) }}">
  {%- block brand_content %}
  {%- if logo_url %}
  <div class="sidebar-logo-container">
    <img class="sidebar-logo" src="{{ logo_url }}" alt="{{ _('Logo') }}"/>
  </div>
  {%- endif %}
  {%- if theme_light_logo and theme_dark_logo %}
  <div class="sidebar-logo-container">
    <img class="sidebar-logo only-light" src="{{ pathto('_static/' + theme_light_logo, 1) }}" alt="{{ _('Light Logo') }}"/>
    <img class="sidebar-logo only-dark" src="{{ pathto('_static/' + theme_dark_logo, 1) }}" alt="{{ _('Dark Logo') }}"/>
  </div>
  {%- endif %}
  {% if not theme_sidebar_hide_name %}
  <span class="sidebar-brand-text">{{ project }} · v{{ display_version }}</span>
  {%- endif %}
  {% endblock brand_content %}
</a>
<nav class="language-switch" aria-label="{{ _('Language') }}">
  <a href="{{ language_links.en }}" lang="en" hreflang="en"{% if language == 'en' %} aria-current="page"{% endif %}>English</a>
  <span aria-hidden="true"> / </span>
  <a href="{{ language_links.zh_CN }}" lang="zh-CN" hreflang="zh-CN"{% if language == 'zh_CN' %} aria-current="page"{% endif %}>简体中文</a>
</nav>
